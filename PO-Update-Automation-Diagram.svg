<svg viewBox="0 0 1200 1315" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B7B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
  </defs>

  <rect width="1200" height="1315" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1F3864">PO Update Automation — How It Works</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#5A6B7B">Vendor shipping email → parsed &amp; matched automatically → Paula reviews &amp; approves → NetSuite updated</text>

  <!-- ===== Column layout ===== -->
  <!-- 1. Vendor email -->
  <rect x="440" y="105" width="320" height="70" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="132" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">1. Vendor sends shipping update</text>
  <text x="600" y="152" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Packing slip (Excel) + shipping advice (PDF) to Paula's inbox</text>
  <text x="600" y="167" text-anchor="middle" font-size="11.5" fill="#8B98A6" font-style="italic">~10–20 emails/week</text>

  <line x1="600" y1="175" x2="600" y2="210" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Intake -->
  <rect x="400" y="212" width="400" height="72" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="238" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">2. Automated intake</text>
  <text x="600" y="258" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Checks the mailbox every 15–30 minutes and pulls new</text>
  <text x="600" y="273" text-anchor="middle" font-size="12.5" fill="#4A5A6A">vendor attachments automatically</text>

  <line x1="600" y1="284" x2="600" y2="319" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Parsing -->
  <rect x="400" y="321" width="400" height="78" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="347" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">3. Read the documents</text>
  <text x="600" y="367" text-anchor="middle" font-size="12.5" fill="#4A5A6A">AI extracts PO #, style, color, size, quantity,</text>
  <text x="600" y="382" text-anchor="middle" font-size="12.5" fill="#4A5A6A">and ship dates — handles each vendor's own layout</text>

  <line x1="600" y1="399" x2="600" y2="434" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Match + Diff -->
  <rect x="400" y="436" width="400" height="86" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">4. Match to the NetSuite PO</text>
  <text x="600" y="482" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Finds the right PO line and compares vendor's numbers</text>
  <text x="600" y="497" text-anchor="middle" font-size="12.5" fill="#4A5A6A">to what's currently in NetSuite — computes what changed</text>
  <text x="600" y="514" text-anchor="middle" font-size="11.5" fill="#8B98A6" font-style="italic">Nothing in NetSuite is touched yet</text>

  <line x1="600" y1="522" x2="600" y2="557" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Review email -->
  <rect x="360" y="559" width="480" height="90" rx="10" fill="#FFF6E0" stroke="#C99A1F" stroke-width="1.8"/>
  <text x="600" y="586" text-anchor="middle" font-size="15.5" font-weight="700" fill="#7A5A00">5. Paula reviews the proposed changes</text>
  <text x="600" y="607" text-anchor="middle" font-size="12.5" fill="#5A4A20">A short email shows old vs. new quantity and dates,</text>
  <text x="600" y="622" text-anchor="middle" font-size="12.5" fill="#5A4A20">side by side, with a one-click Approve or Reject</text>
  <text x="600" y="640" text-anchor="middle" font-size="12" fill="#8A6A10" font-weight="600">Human sign-off, every single time — no exceptions</text>

  <line x1="600" y1="649" x2="600" y2="684" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
  <text x="740" y="670" text-anchor="middle" font-size="12" fill="#2E7D32" font-weight="600">Approved</text>

  <!-- 6. Write to NetSuite -->
  <rect x="400" y="686" width="400" height="76" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="712" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">6. NetSuite is updated</text>
  <text x="600" y="732" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Quantity, Expected Receipt Date, Override flag, and</text>
  <text x="600" y="747" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Updated Receipt Date are written automatically</text>

  <line x1="600" y1="762" x2="600" y2="797" stroke="#5A6B7B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. Confirmation -->
  <rect x="440" y="799" width="320" height="62" rx="10" fill="#EAF1FB" stroke="#2F5C9E" stroke-width="1.5"/>
  <text x="600" y="825" text-anchor="middle" font-size="15" font-weight="600" fill="#1F3864">7. Confirmation sent to Paula</text>
  <text x="600" y="845" text-anchor="middle" font-size="12.5" fill="#4A5A6A">Every action is logged for audit history</text>

  <!-- Reject branch -->
  <line x1="360" y1="604" x2="150" y2="604" stroke="#B23B3B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 150 604 L 150 830 L 440 830" stroke="#B23B3B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="150" y="592" text-anchor="middle" font-size="12" fill="#B23B3B" font-weight="600">Rejected /</text>
  <text x="150" y="606" text-anchor="middle" font-size="12" fill="#B23B3B" font-weight="600">edited</text>
  <rect x="60" y="700" width="180" height="70" rx="8" fill="#FBECEC" stroke="#B23B3B" stroke-width="1.3"/>
  <text x="150" y="726" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7A2626">Stays flagged</text>
  <text x="150" y="744" text-anchor="middle" font-size="11.5" fill="#7A2626">Paula resolves</text>
  <text x="150" y="759" text-anchor="middle" font-size="11.5" fill="#7A2626">manually — nothing lost</text>

  <!-- Divider -->
  <line x1="60" y1="895" x2="1140" y2="895" stroke="#DDE3EA" stroke-width="1.5"/>

  <!-- Bottom: Why this matters for Paula -->
  <text x="600" y="930" text-anchor="middle" font-size="17" font-weight="700" fill="#1F3864">What this means for Paula</text>

  <rect x="60" y="955" width="330" height="120" rx="10" fill="#F4F8FF" stroke="#B9CDE8" stroke-width="1.2"/>
  <text x="225" y="985" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Hours back every week</text>
  <text x="225" y="1008" text-anchor="middle" font-size="12" fill="#4A5A6A">No more manually re-typing</text>
  <text x="225" y="1024" text-anchor="middle" font-size="12" fill="#4A5A6A">quantities and dates from every</text>
  <text x="225" y="1040" text-anchor="middle" font-size="12" fill="#4A5A6A">vendor email into NetSuite</text>
  <text x="225" y="1060" text-anchor="middle" font-size="12" fill="#4A5A6A">line by line</text>

  <rect x="435" y="955" width="330" height="120" rx="10" fill="#F4F8FF" stroke="#B9CDE8" stroke-width="1.2"/>
  <text x="600" y="985" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">Fewer costly mistakes</text>
  <text x="600" y="1008" text-anchor="middle" font-size="12" fill="#4A5A6A">Manual re-entry is where typos</text>
  <text x="600" y="1024" text-anchor="middle" font-size="12" fill="#4A5A6A">and mismatched lines creep in —</text>
  <text x="600" y="1040" text-anchor="middle" font-size="12" fill="#4A5A6A">this pipeline flags anything it's</text>
  <text x="600" y="1060" text-anchor="middle" font-size="12" fill="#4A5A6A">not confident about instead of guessing</text>

  <rect x="810" y="955" width="330" height="120" rx="10" fill="#F4F8FF" stroke="#B9CDE8" stroke-width="1.2"/>
  <text x="975" y="985" text-anchor="middle" font-size="14" font-weight="700" fill="#1F3864">She stays in control</text>
  <text x="975" y="1008" text-anchor="middle" font-size="12" fill="#4A5A6A">Nothing writes to NetSuite</text>
  <text x="975" y="1024" text-anchor="middle" font-size="12" fill="#4A5A6A">without her approval —</text>
  <text x="975" y="1040" text-anchor="middle" font-size="12" fill="#4A5A6A">by permanent design, not as a</text>
  <text x="975" y="1060" text-anchor="middle" font-size="12" fill="#4A5A6A">training-wheels step to remove later</text>

  <!-- Infra footer -->
  <line x1="60" y1="1105" x2="1140" y2="1105" stroke="#DDE3EA" stroke-width="1.5"/>
  <text x="600" y="1140" text-anchor="middle" font-size="15" font-weight="700" fill="#1F3864">Built on infrastructure Straight Down already uses</text>

  <rect x="90" y="1165" width="255" height="90" rx="8" fill="#F7F9FB" stroke="#D4DAE1" stroke-width="1.2"/>
  <text x="217" y="1192" text-anchor="middle" font-size="13" font-weight="700" fill="#33475A">Microsoft 365 / Outlook</text>
  <text x="217" y="1213" text-anchor="middle" font-size="11.5" fill="#5A6B7B">Reads Paula's inbox for</text>
  <text x="217" y="1229" text-anchor="middle" font-size="11.5" fill="#5A6B7B">vendor shipping emails</text>

  <rect x="368" y="1165" width="255" height="90" rx="8" fill="#F7F9FB" stroke="#D4DAE1" stroke-width="1.2"/>
  <text x="495" y="1192" text-anchor="middle" font-size="13" font-weight="700" fill="#33475A">Azure (Microsoft cloud)</text>
  <text x="495" y="1213" text-anchor="middle" font-size="11.5" fill="#5A6B7B">Serverless hosting — pay only</text>
  <text x="495" y="1229" text-anchor="middle" font-size="11.5" fill="#5A6B7B">for the minutes it actually runs</text>

  <rect x="646" y="1165" width="255" height="90" rx="8" fill="#F7F9FB" stroke="#D4DAE1" stroke-width="1.2"/>
  <text x="773" y="1192" text-anchor="middle" font-size="13" font-weight="700" fill="#33475A">Anthropic (Claude)</text>
  <text x="773" y="1213" text-anchor="middle" font-size="11.5" fill="#5A6B7B">Reads each vendor's own</text>
  <text x="773" y="1229" text-anchor="middle" font-size="11.5" fill="#5A6B7B">document layout</text>

  <rect x="924" y="1165" width="215" height="90" rx="8" fill="#F7F9FB" stroke="#D4DAE1" stroke-width="1.2"/>
  <text x="1031" y="1192" text-anchor="middle" font-size="13" font-weight="700" fill="#33475A">NetSuite</text>
  <text x="1031" y="1213" text-anchor="middle" font-size="11.5" fill="#5A6B7B">Sandbox first, always —</text>
  <text x="1031" y="1229" text-anchor="middle" font-size="11.5" fill="#5A6B7B">tested there before production</text>

  <text x="600" y="1290" text-anchor="middle" font-size="11.5" fill="#9AA6B1">Straight Down Clothing Co. — PO Update Automation — prepared by Kiko Barroso, 2026-08-05</text>
</svg>
