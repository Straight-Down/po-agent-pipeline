# Alembic configuration for the PO update pipeline database.
#
# The URL here is the local SQLite development database. Azure SQL is set through
# PO_AGENT_DB_URL instead (see migrations/env.py), so a connection string with a
# password never lands in a file that syncs to OneDrive.
#
#   alembic upgrade head          # apply
#   alembic downgrade base        # unapply (tested in test_schema.py)
#   alembic check                 # metadata vs migrations drift

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///po_agent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
